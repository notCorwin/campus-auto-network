[package]
name = "csust-auto-login"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
description = "CSUST eportal 校园网自动登录工具（Rust 重写版）"

[dependencies]
reqwest = { version = "0.12", features = ["native-tls", "blocking"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
